<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartaska - Juego de Cartas</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="../background/background.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Game Engines -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.2.4/dist/pixi.min.js"></script>

    <!-- Card Game Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/cards.js@1.0.1/cards.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/deck-of-cards@0.1.8/dist/deck.min.js"></script>

    <!-- Audio -->
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <!-- Animation & Effects -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

    <!-- Pixel Art Support -->
    <script src="https://cdn.jsdelivr.net/npm/melonjs@15.5.0/dist/melonjs.min.js"></script>

    <!-- Utilities -->
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="card-table">
            <!-- Área central del juego -->
            <div id="game-board"></div>
            
            <!-- Área del jugador -->
            <div class="player-area" id="player-hand"></div>
            
            <!-- Área de oponentes (se generará dinámicamente con JS) -->
            <div id="opponents-area"></div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="../background/background.js"></script>
    <script src="game.js"></script>
</body>
</html>
